<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 「错了没」应用图标 —— 红叉圈（错）在后，白勾圈（对）在前：
       错过的题被改对，就是这个名字讲的故事。
       用途：App 图标 / 各商店上架素材的母版。512 viewBox，圆角由平台自己裁。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d7bee"/>
      <stop offset="1" stop-color="#2456c4"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 错：半透明白描边的圆 + 白叉，退后半步 -->
  <circle cx="202" cy="256" r="102" fill="rgba(255,255,255,.14)" stroke="#ffffff" stroke-width="15"/>
  <path d="M168 222l68 68m0-68l-68 68" stroke="#ffffff" stroke-width="26" stroke-linecap="round"/>
  <!-- 对：实心白圆 + 品牌蓝的勾，压在前面 -->
  <circle cx="320" cy="256" r="116" fill="#ffffff"/>
  <path d="M272 258l33 35 62-72" stroke="#2f6bd8" stroke-width="30" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
